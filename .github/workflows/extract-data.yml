name: Extract Sky AccessKey Fingerprint and localizable strings

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Optional APK URL. Leave empty to use latest history.json record."
        required: false
        type: string
      package_name:
        description: "Package name in history.json"
        required: false
        default: "com.tgc.sky.android.huawei"
        type: string
      history_url:
        description: "history.json path or URL"
        required: false
        default: "history.json"
        type: string
      accesskey_regex:
        description: "Optional regex with the candidate in capture group 1"
        required: false
        type: string
  #schedule:
    #- cron: "20 4 * * *"

# 與 deploy.yml 共用同一組，避免兩個 workflow 同時 push 互撞
concurrency:
  group: repo-push
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Download APK, scan DEX accesskey and extract arsc strings
        env:
          HISTORY_URL: ${{ inputs.history_url || 'history.json' }}
          PACKAGE_NAME: ${{ inputs.package_name || 'com.tgc.sky.android.huawei' }}
          APK_URL: ${{ inputs.apk_url }}
          ACCESSKEY_REGEX: ${{ inputs.accesskey_regex }}
          # 字串抽取設定（同一次 APK 下載一併產出 strings/）
          STRINGS_DIR: strings
          STRINGS_FORMAT: strings
        run: |
          args=()
          if [ -n "$ACCESSKEY_REGEX" ]; then
            args+=(--accesskey-regex "$ACCESSKEY_REGEX")
          fi
          python scripts/extract_accesskey.py "${args[@]}"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: sky-accesskey-report
          path: out/
          retention-days: 30

      - name: Commit and push changed files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # 只提交有變動／新增的檔案：accesskey.json 與 strings/
          git add accesskey.json strings/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update accesskey and localized strings"
          # 先同步遠端（例如 deploy.yml 剛推過 history.json），失敗重試
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push 失敗，第 $i 次重試..."
            sleep 5
          done
          exit 1